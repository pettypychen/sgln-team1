<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="A laptop showing financial spreadsheet data late at night for month end close">
  <title>Month end close – financial spreadsheet</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a2e"/>
      <stop offset="1" stop-color="#060d18"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#0e0c08"/>
    </linearGradient>
    <linearGradient id="laptop-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2e34"/>
      <stop offset="1" stop-color="#1a1e24"/>
    </linearGradient>
    <linearGradient id="screen-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a1a"/>
      <stop offset="1" stop-color="#081a10"/>
    </linearGradient>
    <radialGradient id="screen-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#1a6640" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#1a6640" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="room-glow" cx="50%" cy="45%" r="52%">
      <stop offset="0" stop-color="#1a5535" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1a5535" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hinge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3e44"/>
      <stop offset="1" stop-color="#22262c"/>
    </linearGradient>
    <filter id="screen-blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow-blur"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="drop-shadow"><feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000" flood-opacity="0.7"/></filter>
    <clipPath id="screen-clip">
      <path d="M484 118 L1116 118 L1116 682 L484 682 Z"/>
    </clipPath>
  </defs>

  <!-- Dark office background -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <!-- Screen glow cast on room -->
  <ellipse cx="800" cy="420" rx="700" ry="500" fill="url(#room-glow)"/>

  <!-- Desk surface -->
  <rect x="0" y="780" width="1600" height="220" fill="url(#desk)"/>
  <rect x="0" y="780" width="1600" height="3" fill="#2a2a22" opacity="0.6"/>

  <!-- ── LAPTOP ── -->
  <!-- Laptop shadow -->
  <ellipse cx="800" cy="792" rx="520" ry="36" fill="#000" opacity="0.6" filter="url(#glow-blur)"/>

  <!-- === SCREEN PANEL === -->
  <!-- Screen outer bezel -->
  <path d="M450 80 Q450 62 468 62 L1132 62 Q1150 62 1150 80 L1150 704 Q1150 720 1132 720 L468 720 Q450 720 450 704 Z" fill="url(#laptop-body)" filter="url(#drop-shadow)"/>
  <!-- Screen inner bezel (slightly inset, darker) -->
  <path d="M470 88 L1130 88 L1130 698 L470 698 Z" fill="#141618" rx="4"/>
  <!-- Screen active area -->
  <path d="M484 102 L1116 102 L1116 686 L484 686 Z" fill="url(#screen-bg)"/>
  <!-- Screen glow radial overlay -->
  <path d="M484 102 L1116 102 L1116 686 L484 686 Z" fill="url(#screen-glow)"/>

  <!-- ── SPREADSHEET CONTENT ON SCREEN ── -->
  <g clip-path="url(#screen-clip)">
    <!-- Column header row -->
    <rect x="484" y="102" width="632" height="38" fill="#0d3320" opacity="0.9"/>
    <!-- Header cell borders -->
    <line x1="570" y1="102" x2="570" y2="140" stroke="#1a5535" stroke-width="1" opacity="0.7"/>
    <line x1="656" y1="102" x2="656" y2="140" stroke="#1a5535" stroke-width="1" opacity="0.7"/>
    <line x1="742" y1="102" x2="742" y2="140" stroke="#1a5535" stroke-width="1" opacity="0.7"/>
    <line x1="828" y1="102" x2="828" y2="140" stroke="#1a5535" stroke-width="1" opacity="0.7"/>
    <line x1="914" y1="102" x2="914" y2="140" stroke="#1a5535" stroke-width="1" opacity="0.7"/>
    <line x1="1000" y1="102" x2="1000" y2="140" stroke="#1a5535" stroke-width="1" opacity="0.7"/>
    <line x1="1086" y1="102" x2="1086" y2="140" stroke="#1a5535" stroke-width="1" opacity="0.7"/>
    <!-- Header labels (simplified bars) -->
    <rect x="492" y="116" width="60" height="8" fill="#2a8850" rx="2" opacity="0.85"/>
    <rect x="578" y="116" width="58" height="8" fill="#2a8850" rx="2" opacity="0.85"/>
    <rect x="664" y="116" width="58" height="8" fill="#2a8850" rx="2" opacity="0.85"/>
    <rect x="750" y="116" width="58" height="8" fill="#2a8850" rx="2" opacity="0.85"/>
    <rect x="836" y="116" width="58" height="8" fill="#2a8850" rx="2" opacity="0.85"/>
    <rect x="922" y="116" width="58" height="8" fill="#2a8850" rx="2" opacity="0.85"/>
    <rect x="1008" y="116" width="68" height="8" fill="#2a8850" rx="2" opacity="0.85"/>

    <!-- Data rows -->
    <!-- Row lines and cells -->
    <g fill="none" stroke="#1a4428" stroke-width="1" opacity="0.55">
      <line x1="484" y1="140" x2="1116" y2="140"/>
      <line x1="484" y1="176" x2="1116" y2="176"/>
      <line x1="484" y1="212" x2="1116" y2="212"/>
      <line x1="484" y1="248" x2="1116" y2="248"/>
      <line x1="484" y1="284" x2="1116" y2="284"/>
      <line x1="484" y1="320" x2="1116" y2="320"/>
      <line x1="484" y1="356" x2="1116" y2="356"/>
      <line x1="484" y1="392" x2="1116" y2="392"/>
      <line x1="484" y1="428" x2="1116" y2="428"/>
      <line x1="484" y1="464" x2="1116" y2="464"/>
      <line x1="484" y1="500" x2="1116" y2="500"/>
      <line x1="484" y1="536" x2="1116" y2="536"/>
      <line x1="484" y1="572" x2="1116" y2="572"/>
      <line x1="484" y1="608" x2="1116" y2="608"/>
      <line x1="484" y1="644" x2="1116" y2="644"/>
      <line x1="484" y1="680" x2="1116" y2="680"/>
      <!-- Vertical column lines -->
      <line x1="570" y1="140" x2="570" y2="686"/>
      <line x1="656" y1="140" x2="656" y2="686"/>
      <line x1="742" y1="140" x2="742" y2="686"/>
      <line x1="828" y1="140" x2="828" y2="686"/>
      <line x1="914" y1="140" x2="914" y2="686"/>
      <line x1="1000" y1="140" x2="1000" y2="686"/>
      <line x1="1086" y1="140" x2="1086" y2="686"/>
    </g>

    <!-- Row labels (left column text bars) -->
    <g fill="#3aaa60" opacity="0.7">
      <rect x="492" y="152" width="56" height="7" rx="2"/>
      <rect x="492" y="188" width="62" height="7" rx="2"/>
      <rect x="492" y="224" width="48" height="7" rx="2"/>
      <rect x="492" y="260" width="58" height="7" rx="2"/>
      <rect x="492" y="296" width="52" height="7" rx="2"/>
      <rect x="492" y="332" width="60" height="7" rx="2"/>
      <rect x="492" y="368" width="44" height="7" rx="2"/>
      <rect x="492" y="404" width="56" height="7" rx="2"/>
      <rect x="492" y="440" width="50" height="7" rx="2"/>
      <rect x="492" y="476" width="62" height="7" rx="2"/>
      <rect x="492" y="512" width="46" height="7" rx="2"/>
      <rect x="492" y="548" width="58" height="7" rx="2"/>
      <rect x="492" y="584" width="52" height="7" rx="2"/>
      <rect x="492" y="620" width="60" height="7" rx="2"/>
    </g>

    <!-- Data cells – numbers (bright for positive, dim for regular) -->
    <g fill="#50e888" opacity="0.82" font-family="monospace">
      <!-- Row 1 -->
      <rect x="580" y="152" width="52" height="7" rx="1"/>
      <rect x="666" y="152" width="48" height="7" rx="1"/>
      <rect x="752" y="152" width="54" height="7" rx="1"/>
      <rect x="838" y="152" width="46" height="7" rx="1"/>
      <rect x="924" y="152" width="52" height="7" rx="1"/>
      <rect x="1010" y="152" width="60" height="7" rx="1"/>
      <!-- Row 2 -->
      <rect x="580" y="188" width="48" height="7" rx="1"/>
      <rect x="666" y="188" width="56" height="7" rx="1"/>
      <rect x="752" y="188" width="50" height="7" rx="1"/>
      <rect x="838" y="188" width="52" height="7" rx="1"/>
      <rect x="924" y="188" width="44" height="7" rx="1"/>
      <rect x="1010" y="188" width="58" height="7" rx="1"/>
      <!-- Row 3 -->
      <rect x="580" y="224" width="54" height="7" rx="1"/>
      <rect x="666" y="224" width="46" height="7" rx="1"/>
      <rect x="752" y="224" width="52" height="7" rx="1"/>
      <rect x="838" y="224" width="48" height="7" rx="1"/>
      <rect x="924" y="224" width="56" height="7" rx="1"/>
      <rect x="1010" y="224" width="50" height="7" rx="1"/>
      <!-- Row 4 (highlighted - current period) -->
    </g>
    <!-- Highlighted row (current period being closed) -->
    <rect x="484" y="248" width="632" height="36" fill="#1a6640" opacity="0.35"/>
    <g fill="#a0ffc0" opacity="0.95">
      <rect x="580" y="260" width="52" height="8" rx="1"/>
      <rect x="666" y="260" width="56" height="8" rx="1"/>
      <rect x="752" y="260" width="48" height="8" rx="1"/>
      <rect x="838" y="260" width="54" height="8" rx="1"/>
      <rect x="924" y="260" width="46" height="8" rx="1"/>
      <rect x="1010" y="260" width="68" height="8" rx="1"/>
    </g>
    <!-- More data rows -->
