      <rect x="580" y="296" width="50" height="7" rx="1"/>
      <rect x="666" y="296" width="54" height="7" rx="1"/>
      <rect x="752" y="296" width="46" height="7" rx="1"/>
      <rect x="838" y="296" width="52" height="7" rx="1"/>
      <rect x="924" y="296" width="50" height="7" rx="1"/>
      <rect x="1010" y="296" width="56" height="7" rx="1"/>
      <rect x="580" y="332" width="56" height="7" rx="1"/>
      <rect x="666" y="332" width="44" height="7" rx="1"/>
      <rect x="752" y="332" width="58" height="7" rx="1"/>
      <rect x="838" y="332" width="48" height="7" rx="1"/>
      <rect x="924" y="332" width="52" height="7" rx="1"/>
      <rect x="1010" y="332" width="46" height="7" rx="1"/>
      <rect x="580" y="368" width="48" height="7" rx="1"/>
      <rect x="666" y="368" width="56" height="7" rx="1"/>
      <rect x="752" y="368" width="50" height="7" rx="1"/>
      <rect x="838" y="368" width="54" height="7" rx="1"/>
      <rect x="924" y="368" width="44" height="7" rx="1"/>
      <rect x="1010" y="368" width="60" height="7" rx="1"/>
      <rect x="580" y="404" width="52" height="7" rx="1"/>
      <rect x="666" y="404" width="48" height="7" rx="1"/>
      <rect x="752" y="404" width="56" height="7" rx="1"/>
      <rect x="838" y="404" width="44" height="7" rx="1"/>
      <rect x="924" y="404" width="58" height="7" rx="1"/>
      <rect x="1010" y="404" width="50" height="7" rx="1"/>
      <rect x="580" y="440" width="46" height="7" rx="1"/>
      <rect x="666" y="440" width="54" height="7" rx="1"/>
      <rect x="752" y="440" width="52" height="7" rx="1"/>
      <rect x="838" y="440" width="50" height="7" rx="1"/>
      <rect x="924" y="440" width="48" height="7" rx="1"/>
      <rect x="1010" y="440" width="62" height="7" rx="1"/>
    </g>

    <!-- Totals row (bold/highlighted at bottom) -->
    <rect x="484" y="536" width="632" height="36" fill="#0d3320" opacity="0.8"/>
    <line x1="484" y1="536" x2="1116" y2="536" stroke="#2a8850" stroke-width="2" opacity="0.8"/>
    <line x1="484" y1="572" x2="1116" y2="572" stroke="#2a8850" stroke-width="2" opacity="0.8"/>
    <g fill="#a0ffc0" opacity="0.9">
      <rect x="492" y="548" width="60" height="9" rx="2"/>
      <rect x="580" y="548" width="58" height="9" rx="2"/>
      <rect x="666" y="548" width="54" height="9" rx="2"/>
      <rect x="752" y="548" width="60" height="9" rx="2"/>
      <rect x="838" y="548" width="52" height="9" rx="2"/>
      <rect x="924" y="548" width="56" height="9" rx="2"/>
      <rect x="1010" y="548" width="72" height="9" rx="2"/>
    </g>

    <!-- Screen reflection/glare -->
    <path d="M484 102 L800 102 L600 686 L484 686 Z" fill="white" opacity="0.025"/>
  </g>

  <!-- Screen bezel glow edge -->
  <path d="M470 88 L1130 88 L1130 698 L470 698 Z" fill="none" stroke="#2a6640" stroke-width="2" opacity="0.5"/>

  <!-- ── LAPTOP BASE (keyboard) ── -->
  <path d="M380 720 Q380 704 400 704 L1200 704 Q1220 704 1220 720 L1240 786 Q1242 800 1220 800 L380 800 Q358 800 360 786 Z" fill="url(#laptop-body)"/>
  <!-- Keyboard surface -->
  <path d="M400 716 L1200 716 L1218 782 L382 782 Z" fill="#1e2228"/>
  <!-- Keyboard key grid (simplified) -->
  <g fill="#2e3238" opacity="0.8">
    <!-- Row 1 keys -->
    <rect x="420" y="724" width="32" height="14" rx="3"/>
    <rect x="458" y="724" width="32" height="14" rx="3"/>
    <rect x="496" y="724" width="32" height="14" rx="3"/>
    <rect x="534" y="724" width="32" height="14" rx="3"/>
    <rect x="572" y="724" width="32" height="14" rx="3"/>
    <rect x="610" y="724" width="32" height="14" rx="3"/>
    <rect x="648" y="724" width="32" height="14" rx="3"/>
    <rect x="686" y="724" width="32" height="14" rx="3"/>
    <rect x="724" y="724" width="32" height="14" rx="3"/>
    <rect x="762" y="724" width="32" height="14" rx="3"/>
    <rect x="800" y="724" width="32" height="14" rx="3"/>
    <rect x="838" y="724" width="32" height="14" rx="3"/>
    <rect x="876" y="724" width="32" height="14" rx="3"/>
    <rect x="914" y="724" width="32" height="14" rx="3"/>
    <rect x="952" y="724" width="32" height="14" rx="3"/>
    <rect x="990" y="724" width="32" height="14" rx="3"/>
    <rect x="1028" y="724" width="32" height="14" rx="3"/>
    <rect x="1066" y="724" width="32" height="14" rx="3"/>
    <rect x="1104" y="724" width="32" height="14" rx="3"/>
    <rect x="1142" y="724" width="48" height="14" rx="3"/>
    <!-- Row 2 keys -->
    <rect x="420" y="744" width="48" height="14" rx="3"/>
    <rect x="474" y="744" width="32" height="14" rx="3"/>
    <rect x="512" y="744" width="32" height="14" rx="3"/>
    <rect x="550" y="744" width="32" height="14" rx="3"/>
    <rect x="588" y="744" width="32" height="14" rx="3"/>
    <rect x="626" y="744" width="32" height="14" rx="3"/>
    <rect x="664" y="744" width="32" height="14" rx="3"/>
    <rect x="702" y="744" width="32" height="14" rx="3"/>
    <rect x="740" y="744" width="32" height="14" rx="3"/>
    <rect x="778" y="744" width="32" height="14" rx="3"/>
    <rect x="816" y="744" width="32" height="14" rx="3"/>
    <rect x="854" y="744" width="32" height="14" rx="3"/>
    <rect x="892" y="744" width="32" height="14" rx="3"/>
    <rect x="930" y="744" width="32" height="14" rx="3"/>
    <rect x="968" y="744" width="32" height="14" rx="3"/>
    <rect x="1006" y="744" width="32" height="14" rx="3"/>
    <rect x="1044" y="744" width="32" height="14" rx="3"/>
    <rect x="1082" y="744" width="32" height="14" rx="3"/>
    <rect x="1120" y="744" width="70" height="14" rx="3"/>
    <!-- Spacebar row -->
    <rect x="420" y="763" width="56" height="13" rx="3"/>
    <rect x="540" y="763" width="380" height="13" rx="3"/>
    <rect x="932" y="763" width="40" height="13" rx="3"/>
    <rect x="978" y="763" width="40" height="13" rx="3"/>
    <rect x="1024" y="763" width="40" height="13" rx="3"/>
    <rect x="1070" y="763" width="40" height="13" rx="3"/>
    <rect x="1116" y="763" width="74" height="13" rx="3"/>
  </g>
  <!-- Touchpad -->
  <rect x="686" y="760" width="228" height="16" rx="5" fill="#252830" opacity="0.6"/>

  <!-- Laptop hinge -->
  <rect x="450" y="698" width="700" height="10" fill="url(#hinge)"/>

  <!-- Screen glow cast down on keyboard -->
  <rect x="380" y="704" width="840" height="100" fill="#1a6640" opacity="0.06"/>

  <!-- Screen glare reflection on desk -->
  <ellipse cx="800" cy="820" rx="280" ry="14" fill="#2a8850" opacity="0.08"/>

  <!-- Clock in top-right (deadline pressure) -->
  <circle cx="1440" cy="120" r="72" fill="#0d1a2e" stroke="#1a4428" stroke-width="4"/>
  <circle cx="1440" cy="120" r="66" fill="#0f2218"/>
  <!-- Clock face markings -->
  <g stroke="#2a6640" stroke-width="3" opacity="0.8">
    <line x1="1440" y1="58" x2="1440" y2="68"/>
    <line x1="1440" y1="172" x2="1440" y2="182"/>
    <line x1="1378" y1="120" x2="1388" y2="120"/>
    <line x1="1492" y1="120" x2="1502" y2="120"/>
  </g>
  <!-- Clock hands - showing ~11:45 (almost midnight) -->
  <line x1="1440" y1="120" x2="1440" y2="72" stroke="#50e888" stroke-width="5" stroke-linecap="round"/>
  <line x1="1440" y1="120" x2="1474" y2="106" stroke="#50e888" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1440" cy="120" r="6" fill="#50e888"/>
  <!-- Clock label -->
  <rect x="1370" y="196" width="140" height="18" fill="none"/>
</svg>
